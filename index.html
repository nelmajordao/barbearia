<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>Barbearia Capitão — Marcações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface2:#1E1E1E; --border:#2A2A2A;
    --accent:#B8952A; --accent-light:#D4AF5A; --accent-dim:rgba(184,149,42,.16);
    --text:#EEEEEE; --muted:#999999; --muted2:#555555; --btn-fg:#0A0A0A;
    --pending:#8B2E2E; --pending-bg:rgba(139,46,46,.16); --confirmed:#5C7A5C; --confirmed-bg:rgba(92,122,92,.16);
    --danger:#E08A8A; --ok:#9CC09C;
    --display:'Bebas Neue',Impact,sans-serif; --mono:'IBM Plex Mono',Menlo,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
  input{font:inherit;color:var(--text)}
  .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .view{display:none;flex-direction:column;flex:1}
  .view.active{display:flex}

  /* Topbar */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 16px;border-bottom:1px solid var(--border)}
  .brand{font-family:var(--display);font-size:26px;letter-spacing:1.5px;color:var(--accent);line-height:1.25;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font-size:11px;letter-spacing:2px;color:var(--muted2);font-weight:500;margin-top:2px}
  .tb-left{flex:1;min-width:0}
  .tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .palette{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);color:var(--accent);font-size:18px;line-height:1;display:grid;place-items:center;background:var(--surface)}
  .palette:hover{border-color:var(--accent)}
  .logo{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--accent),0 0 10px rgba(184,149,42,.3);flex-shrink:0}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}

  .content{flex:1;padding:20px}
  h2{font-family:var(--display);font-size:22px;letter-spacing:.5px;font-weight:400;line-height:1.1}
  h2.small{font-size:18px}
  .lead{font-size:13px;color:var(--muted2);margin-top:4px;margin-bottom:8px;line-height:1.5}
  .label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:600;margin:18px 0 7px}

  .input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;outline:none;color:var(--text)}
  .input:focus{border-color:var(--accent)}
  .input::placeholder{color:var(--muted2)}
  .input.mono{font-family:var(--mono)}
  

  .btn{width:100%;border-radius:10px;padding:14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--btn-fg)}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{width:100%;border-radius:10px;padding:12px;border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:14px;background:transparent}
  .ghost:hover{border-color:var(--muted2)}
  .sm{width:auto;padding:7px 11px;font-size:12px;border-radius:8px;border:1px solid var(--border);color:var(--muted);font-weight:600}
  .sm.accent{border-color:rgba(201,161,74,.4);color:var(--accent)}
  .sm.danger,.ghost.danger{border-color:rgba(139,46,46,.45);color:var(--danger)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  .pill{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;color:var(--muted);font-weight:600;transition:border-color .12s}
  .pill small{display:block;font-weight:400;font-size:11px;color:var(--muted2);margin-top:2px}
  .pill.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .pill.on small{color:var(--accent);opacity:.8}
  .chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:13px;color:var(--muted)}
  .chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}

  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .day{flex:0 0 58px;height:66px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text)}
  .day span{font-size:10px;letter-spacing:.5px;color:var(--muted2)}
  .day b{font-family:var(--display);font-size:20px;font-weight:400;margin-top:2px}
  .day.on{background:var(--accent-dim);border-color:var(--accent)}
  .day.on span,.day.on b{color:var(--accent)}

  .period{margin-top:8px;padding:13px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--text);font-weight:600}
  .period .n{font-family:var(--mono);font-size:12px;color:var(--muted2);font-weight:400}
  .period.open{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .period.open .n{color:var(--accent)}
  .period:disabled{opacity:.45;cursor:default}
  .slot{padding:11px 0;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--text);text-align:center}
  .slot.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}

  .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:0}
  .empty{color:var(--muted2);font-size:13px;text-align:center;padding:14px 0}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .card .in{padding:18px}
  .ticket-stripe{height:6px;background:repeating-linear-gradient(90deg,var(--pending) 0 12px,var(--accent) 12px 24px)}
  .code{font-family:var(--mono);font-size:11px;color:var(--muted2);letter-spacing:1px}
  .name{font-family:var(--display);font-size:22px;letter-spacing:.5px;margin-top:6px;line-height:1.1}
  .phone{font-size:13px;color:var(--muted2)}
  .badge{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.6px}
  .badge.pending{background:var(--pending-bg);color:var(--danger)}
  .badge.confirmed{background:var(--confirmed-bg);color:var(--ok)}
  .divider{height:1px;background:var(--border);margin:14px 0 12px}
  .fields{display:flex;justify-content:space-between}
  .f label{display:block;font-size:11px;letter-spacing:1px;color:var(--muted2);text-transform:uppercase}
  .f div{font-family:var(--mono);font-size:15px;margin-top:3px}

  .tabs{display:flex;gap:14px;border-bottom:1px solid var(--border);margin:16px 0 18px}
  .tab{padding-bottom:10px;font-size:13px;font-weight:600;color:var(--muted2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--accent);border-color:var(--accent)}

  /* Agenda */
  .agenda-head{display:flex;align-items:center;gap:8px}
  .agenda-wrap{max-width:640px;margin:0 auto}
  .agenda-head h3{flex:1;text-align:center;font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.5px}
  .agenda-count{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted2);margin:10px 0 16px}
  .hint{font-size:11px;color:var(--muted2);line-height:1.4;margin:8px 0 14px}
  .grid{position:relative;user-select:none;touch-action:pan-y}
  .hline{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px}
  .hline span{width:42px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted2)}
  .hline i{flex:1;height:1px;background:var(--border)}
  .lunch{position:absolute;left:48px;right:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 8px;font-size:10px;letter-spacing:1px;color:var(--muted2)}
  .now{position:absolute;left:48px;right:0;height:2px;background:var(--accent);z-index:3}
  .after{position:absolute;left:48px;right:0;border-top:1px dashed var(--muted2);padding:4px 8px;font-size:10px;letter-spacing:1px;color:var(--muted2);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.02) 10px 20px)}
  .block{position:absolute;left:56px;right:0;border-radius:9px;padding:8px 10px 6px 14px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border);border-left-width:3px;overflow:hidden;cursor:grab;z-index:2;touch-action:none}
  .block.pending{background:var(--pending-bg);border-left-color:var(--pending)}
  .block.confirmed{background:var(--confirmed-bg);border-left-color:var(--confirmed)}
  .block.dragging{box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:5;cursor:grabbing}
  .block .ln{display:flex;align-items:baseline;gap:8px;min-width:0}
  .block .tt{font-family:var(--mono);font-size:12px;color:var(--text);flex-shrink:0}
  .block .t{font-family:var(--mono);font-size:10px;color:var(--muted2);flex-shrink:0}
  .block .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .block .sv{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Sheets & toast */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:448px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
  .sheet .label:first-of-type{margin-top:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--accent);color:var(--btn-fg);font-weight:700;padding:12px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .bottom-link{padding:14px;text-align:center;font-size:12px;color:var(--muted2);width:100%}
  .svc-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px}
  .x{padding:0 13px;border:1px solid rgba(139,46,46,.45);border-radius:8px;color:var(--danger);font-size:12px}
  .bl{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:8px;font-family:var(--mono)}
  .loading{flex:1;display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-size:13px}

  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .theme{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
  .theme.on{border-color:var(--accent);background:var(--accent-dim)}
  .theme small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .theme.on small{color:var(--accent);font-weight:600}
  .sw{width:100%;height:34px;border-radius:7px;border:1px solid;display:flex;align-items:flex-end;gap:4px;padding:5px}
  .sw i{display:block;height:8px;border-radius:2px;flex:1}
  .sw i:first-child{flex:2}
  @media (min-width:900px){.themes{grid-template-columns:repeat(5,1fr)}
  .sheet.wide{max-width:560px}}
  @media (max-width:380px){.brand{font-size:22px}.palette{width:32px;height:32px;font-size:16px}.logo{width:48px;height:48px}}
  /* ---- Lista agrupada por dia ---- */
  .day-group{margin-bottom:10px}
  .day-head{position:sticky;top:0;z-index:4;width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:2px;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);text-align:left}
  .day-group.open .day-head{border-radius:10px 10px 0 0}
  .dh-date{font-family:var(--display);font-size:18px;letter-spacing:.5px;flex-shrink:0}
  .dh-meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .dh-meta b{color:var(--danger);font-weight:600}
  .dh-arrow{color:var(--muted2);font-size:12px;grid-row:1}
  .rows{border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;background:var(--surface);overflow:hidden}
  .brow{border-top:1px solid var(--border)}
  .brow:first-child{border-top:0}
  .brow-main{width:100%;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 10px;border-left:3px solid var(--border);text-align:left;color:var(--text)}
  .brow.pending .brow-main{border-left-color:var(--pending)}
  .brow.confirmed .brow-main{border-left-color:var(--confirmed)}
  .brow.exp .brow-main{background:var(--accent-dim)}
  .br-time{font-family:var(--mono);font-size:13px;flex-shrink:0}
  .br-name{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .br-svc{font-size:12px;color:var(--muted);flex-shrink:0;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .br-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--pending)}
  .brow.confirmed .br-dot{background:var(--confirmed)}
  .brow-more{padding:10px 12px 14px 13px;background:var(--surface2)}
  @media (min-width:900px){#admin-body:not(.agenda-mode){display:block}.day-head{top:0}}
  /* ---- Responsivo ---- */
  .cols{display:flex;flex-direction:column}
  .col-side{margin-top:34px}
  @media (min-width:900px){
    .app{max-width:1040px}
    .topbar{padding:26px 32px 18px}
    .brand{font-size:34px}
    .logo{width:76px;height:76px}
    .content{padding:28px 32px 40px}
    .cols{flex-direction:row;gap:48px;align-items:flex-start}
    .col{flex:1;min-width:0}
    .col-side{flex:0 0 360px;margin-top:0;position:sticky;top:24px}
    .grid2{grid-template-columns:repeat(3,1fr)}
    .grid3{grid-template-columns:repeat(5,1fr)}
    .days{flex-wrap:wrap;overflow:visible}
    .day{flex:0 0 64px}
    .block{left:64px}
    .hline span{width:50px}
    .lunch,.now{left:56px}
    #v-login .content,#v-settings .content{max-width:560px;margin:0 auto;width:100%}
    .overlay{align-items:center}
  }
  @media (min-width:1200px){
    .cols{gap:64px}
    .col-side{flex-basis:400px}
  }
  :focus-visible{outline:2px solid var(--accent-light);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== CLIENTE ===== -->
  <section class="view active" id="v-client">
    <div class="topbar"><div class="tb-left"><div class="brand">BARBEARIA CAPITÃO</div><div class="brand-sub">MARCAÇÕES ONLINE</div></div><div class="tb-right"><button class="palette" onclick="openThemePicker()" title="Esquema de cores" aria-label="Escolher esquema de cores">◐</button><div class="logo"><img src="logo.png" alt="Barbearia Capitão"></div></div></div>
    <div class="content" id="client-content"></div>
    <button class="bottom-link" onclick="auth.loggedIn ? enterAdmin() : show('login')">Acesso administrativo →</button>
  </section>

  <!-- ===== LOGIN ===== -->
  <section class="view" id="v-login">
    <div class="topbar"><div class="tb-left"><div class="brand">BARBEARIA CAPITÃO</div><div class="brand-sub">PAINEL ADMINISTRATIVO</div></div><div class="tb-right"><button class="palette" onclick="openThemePicker()" title="Esquema de cores" aria-label="Escolher esquema de cores">◐</button><div class="logo"><img src="logo.png" alt="Barbearia Capitão"></div></div></div>
    <div class="content">
      <h2>Entrar</h2>
      <p class="lead">Área reservada à gestão da barbearia.</p>
      <label class="label" for="email">Email</label>
      <input class="input" id="email" type="email" placeholder="admin@…" autocomplete="username">
      <label class="label" for="pass">Palavra-passe</label>
      <input class="input" id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="err" id="login-err"></div>
      <div style="margin-top:24px"><button class="btn" id="login-btn">Entrar</button></div>
      <div style="margin-top:10px"><button class="ghost" onclick="show('client')">Voltar</button></div>
    </div>
  </section>

  <!-- ===== ADMIN ===== -->
  <section class="view" id="v-admin">
    <div class="topbar"><div class="tb-left"><div class="brand">BARBEARIA CAPITÃO</div><div class="brand-sub">PAINEL ADMINISTRATIVO</div></div><div class="tb-right"><button class="palette" onclick="openThemePicker()" title="Esquema de cores" aria-label="Escolher esquema de cores">◐</button><div class="logo"><img src="logo.png" alt="Barbearia Capitão"></div></div></div>
    <div class="content">
      <div class="between"><h2>Marcações</h2><button class="sm accent" onclick="openSettings()">⚙ Definições</button></div>
      <div class="tabs" id="tabs"></div>
      <div id="admin-body"></div>
      <div style="margin-top:24px"><button class="ghost" onclick="logout()">Terminar sessão</button></div>
    </div>
  </section>

  <!-- ===== DEFINIÇÕES ===== -->
  <section class="view" id="v-settings">
    <div class="topbar"><div class="tb-left"><div class="brand">BARBEARIA CAPITÃO</div><div class="brand-sub">PAINEL ADMINISTRATIVO</div></div><div class="tb-right"><button class="palette" onclick="openThemePicker()" title="Esquema de cores" aria-label="Escolher esquema de cores">◐</button><div class="logo"><img src="logo.png" alt="Barbearia Capitão"></div></div></div>
    <div class="content" id="settings-content"></div>
  </section>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — mesmo Supabase da app
   ========================================================= */
const SB_URL = 'https://unyonayejjwjdfqhjecu.supabase.co';
const SB_KEY = 'sb_publishable_xPdYjv-TX-7cMQVKptDHxg_hPr72BFO';
const REST = SB_URL + '/rest/v1';
const AGENDA_END = '22:00'; // a agenda do admin mostra sempre até esta hora, mesmo que o horário de funcionamento acabe antes

/* ---- Esquemas de cores (iguais aos da app) ---- */
const THEMES = [
  {id:'gold',    name:'Ouro Clássico', bg:'#0A0A0A', surface:'#141414', surface2:'#1E1E1E', border:'#2A2A2A', accent:'#B8952A', accentLight:'#D4AF5A', text:'#EEEEEE', text2:'#999999', text3:'#555555', btnFg:'#0A0A0A', light:false},
  {id:'neon',    name:'Neon Night',    bg:'#0D0D0D', surface:'#151515', surface2:'#1A1A1A', border:'#1E1E1E', accent:'#00F0C0', accentLight:'#00C8A0', text:'#F0F0F0', text2:'#666666', text3:'#333333', btnFg:'#0D0D0D', light:false},
  {id:'lava',    name:'Lava',          bg:'#111107', surface:'#1A1000', surface2:'#221500', border:'#2A1800', accent:'#FF6B00', accentLight:'#FF8C30', text:'#FFF0E0', text2:'#664400', text3:'#3A2800', btnFg:'#0A0500', light:false},
  {id:'glacier', name:'Glacier',       bg:'#F4F8FC', surface:'#FFFFFF', surface2:'#E8F0F8', border:'#D0DFF0', accent:'#0F2040', accentLight:'#1A3A6A', text:'#0F2040', text2:'#6080A0', text3:'#A0B8D0', btnFg:'#F4F8FC', light:true},
  {id:'violet',  name:'Violeta',       bg:'#0E0616', surface:'#140820', surface2:'#1A1028', border:'#1E1030', accent:'#9B59F5', accentLight:'#B87EFF', text:'#EEE8FF', text2:'#4A2880', text3:'#2A1450', btnFg:'#080010', light:false},

/* ---- Sessão de administrador (Supabase Auth) ---- */
const auth = {
  session: null,
  load(){ try { this.session = JSON.parse(sessionStorage.getItem('sb_session') || 'null'); } catch(e){ this.session = null; } return this.session; },
  save(sess){ this.session = sess; try { sess ? sessionStorage.setItem('sb_session', JSON.stringify(sess)) : sessionStorage.removeItem('sb_session'); } catch(e){} },
  get loggedIn(){ return !!(this.session && this.session.access_token); },
  async signIn(email, password){
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, { method:'POST', headers:{ apikey: SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ email, password }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || j.error || 'Credenciais inválidas');
    this.save({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in - 60) * 1000, email: j.user?.email });
  },
  async refresh(){
    if (!this.session?.refresh_token) return false;
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey: SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: this.session.refresh_token }) });
    if (!r.ok){ this.save(null); return false; }
    const j = await r.json();
    this.save({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in - 60) * 1000, email: j.user?.email });
    return true;
  },
  async token(){
    if (!this.session) return null;
    if (Date.now() > this.session.expires_at && !(await this.refresh())) return null;
    return this.session.access_token;
  },
  async signOut(){
    const t = this.session?.access_token;
    this.save(null);
    if (t) fetch(`${SB_URL}/auth/v1/logout`, { method:'POST', headers:{ apikey: SB_KEY, Authorization: 'Bearer ' + t } }).catch(() => {});
  },
  async changePassword(newPass){
    const t = await this.token(); if (!t) throw new Error('Sessão expirada');
    const r = await fetch(`${SB_URL}/auth/v1/user`, { method:'PUT', headers:{ apikey: SB_KEY, Authorization: 'Bearer ' + t, 'Content-Type':'application/json' }, body: JSON.stringify({ password: newPass }) });
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.error_description || 'Erro ao alterar palavra-passe'); }
  },
};
async function hdrs(){ const t = await auth.token(); return { apikey: SB_KEY, Authorization: 'Bearer ' + (t || SB_KEY), 'Content-Type': 'application/json' }; }
async function rpc(name, args){
  const r = await fetch(`${REST}/rpc/${name}`, { method:'POST', headers: await hdrs(), body: JSON.stringify(args || {}) });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || `${name} ${r.status}`);
  return j;
}

const sb = {
  /* público (anon) */
  async getPublicSettings(){ const j = await rpc('public_settings'); return fromJsonSettings(j || {}); },
  async getOccupancy(){ return (await rpc('public_occupancy')) || []; },
  async clientLookup(phone){ return (await rpc('client_lookup', { p_phone: phone })) || []; },
  async createClientBooking(b){ return rpc('create_client_booking', { p_name: b.name, p_phone: b.phone, p_service: b.service, p_date: b.date, p_time: b.time }); },
  /* admin (sessão) */
  async getBookings(){
    const r = await fetch(`${REST}/bookings?select=*&order=date.asc,time.asc`, { headers: await hdrs() });
    if (!r.ok) throw new Error('getBookings ' + r.status);
    return (await r.json()).filter(b => b.status !== 'deleted');
  },
  async getSettings(){
    const r = await fetch(`${REST}/settings?id=eq.1&select=data`, { headers: await hdrs() });
    if (r.ok){ const rows = await r.json(); if (rows.length && rows[0].data) return fromJsonSettings(rows[0].data); }
    throw new Error('getSettings ' + r.status);
  },
  async insert(b){ const r = await fetch(`${REST}/bookings`, { method:'POST', headers:{...await hdrs(), Prefer:'return=minimal'}, body: JSON.stringify(b) }); if (!r.ok) throw new Error('insert ' + r.status); },
  async update(b){ const r = await fetch(`${REST}/bookings?id=eq.${encodeURIComponent(b.id)}`, { method:'PATCH', headers:{...await hdrs(), Prefer:'return=minimal'}, body: JSON.stringify(b) }); if (!r.ok) throw new Error('update ' + r.status); },
  async remove(id){ const r = await fetch(`${REST}/bookings?id=eq.${encodeURIComponent(id)}`, { method:'DELETE', headers:{...await hdrs(), Prefer:'return=minimal'} }); if (!r.ok) throw new Error('delete ' + r.status); },
  async saveSettings(s){ const r = await fetch(`${REST}/settings?id=eq.1`, { method:'PATCH', headers:{...await hdrs(), Prefer:'return=minimal'}, body: JSON.stringify({ data: toJsonSettings(s) }) }); if (!r.ok) throw new Error('saveSettings ' + r.status); },
};

function defaultSettings(){
  return { workingDays:[1,2,4,5,6], startTime:'09:00', endTime:'19:00',
    services:[{key:'corte_normal',label:'Corte normal',duration:30},{key:'corte_tecnico',label:'Corte técnico',duration:45},{key:'barba',label:'Barba',duration:20}],
    lunchEnabled:true, lunchStart:'13:00', lunchEnd:'14:00', blacklist:[] };
}
function fromJsonSettings(j){
  const d = defaultSettings();
  return { workingDays: j.workingDays ?? d.workingDays, startTime: j.startTime ?? d.startTime, endTime: j.endTime ?? d.endTime,
    services: j.services ?? d.services, lunchEnabled: j.lunch?.enabled ?? true, lunchStart: j.lunch?.start ?? '13:00', lunchEnd: j.lunch?.end ?? '14:00',
    blacklist: (j.blacklist ?? []).map(String) };
}
function toJsonSettings(s){
  const o = { workingDays:s.workingDays, startTime:s.startTime, endTime:s.endTime, services:s.services,
    lunch:{enabled:s.lunchEnabled, start:s.lunchStart, end:s.lunchEnd}, blacklist:s.blacklist };
  return o;
}

const state = { bookings: [], occupancy: [], settings: defaultSettings(), loading: true, saving: false };
// ocupação usada no cálculo de horários: como admin, deriva das marcações; como visitante, vem do servidor sem dados pessoais
function occupancyFor(iso){ const src = auth.loggedIn ? state.bookings.filter(b => b.status !== 'deleted') : state.occupancy; return src.filter(o => o.date === iso).map(o => ({ time: o.time, duration: o.duration || (o.service ? svcDur(o.service) : 30) })); }

const svcLabel = k => (state.settings.services.find(s => s.key === k) || {label:k}).label;
const svcDur   = k => (state.settings.services.find(s => s.key === k) || {duration:30}).duration;
const firstSvc = () => state.settings.services.length ? state.settings.services[0].key : 'corte_normal';
const normPhone = p => p.replace(/[\s\-]/g,'').trim();
const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const fmtPretty = iso => { const d = parseISO(iso); return `${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function genCode(){
  const d = new Date();
  const r = (Date.now()*1000 % 46656).toString(36).toUpperCase().padStart(4,'0');
  return `B${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}-${r}`;
}
function genId(){ return `id_${Date.now()}_${Math.floor(Math.random()*1000)}`; }

function forDay(iso){ return state.bookings.filter(b => b.date === iso && b.status !== 'deleted').sort((a,b) => a.time.localeCompare(b.time)); }

function availableSlots(iso, serviceKey){
  if (!iso || iso < todayISO()) return [];
  const s = state.settings, dur = svcDur(serviceKey);
  const dow = parseISO(iso).getDay();
  if (!s.workingDays.includes(dow)) return [];
  const startMin = timeToMin(s.startTime), endMin = timeToMin(s.endTime);
  const lunchStart = s.lunchEnabled ? timeToMin(s.lunchStart) : null;
  const lunchEnd   = s.lunchEnabled ? timeToMin(s.lunchEnd)   : null;
  const dayB = occupancyFor(iso);
  const isToday = iso === todayISO();
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const out = [];
  for (let t = startMin; t + dur <= endMin; t += 15){
    if (isToday && t <= nowMin + 15) continue;
    if (lunchEnd !== null && t < lunchEnd && t + dur > lunchStart) continue;
    const overlaps = dayB.some(b => { const bs = timeToMin(b.time), be = bs + b.duration; return t < be && t + dur > bs; });
    if (!overlaps) out.push(minToTime(t));
  }
  return out;
}

async function reload(){
  try { if (auth.loggedIn) state.bookings = await sb.getBookings(); else state.occupancy = await sb.getOccupancy(); }
  catch(e){ console.warn('reload', e); }
}
async function createClientBooking({name, phone, service, date, time}){
  state.saving = true;
  try {
    const row = await sb.createClientBooking({ name, phone, service, date, time }); // validação toda no servidor
    client.submitted = row; state.occupancy.push({ date: row.date, time: row.time, duration: row.duration }); return null;
  } catch(e){ console.error(e); return e.message && !/^create_client_booking/.test(e.message) ? e.message : 'Erro ao guardar. Tenta novamente.'; }
  finally { state.saving = false; }
}
async function createAdminBooking({name, phone, service, date, time, status}){
  state.saving = true;
  try {
    await reload();
    const dup = state.bookings.some(b => b.status !== 'deleted' && b.date === date && b.time === time && b.service === service && normPhone(b.phone) === normPhone(phone));
    if (!dup){
      const b = { id: genId(), code: genCode(), name, phone, service, date, time, duration: svcDur(service), status, created_at: new Date().toISOString(), created_by: 'admin' };
      await sb.insert(b); state.bookings.push(b);
    }
    return true;
  } catch(e){ console.error(e); return false; } finally { state.saving = false; }
}
async function confirmBooking(id){ const b = state.bookings.find(x => x.id === id); b.status = 'confirmed'; await sb.update(b); }
async function updateBooking(b){ b.duration = svcDur(b.service); await sb.update(b); }
async function moveBooking(id, newTime){ const b = state.bookings.find(x => x.id === id); if (b.time === newTime) return; b.time = newTime; await sb.update(b); }
async function deleteBooking(id){ await sb.remove(id); state.bookings = state.bookings.filter(x => x.id !== id); }
async function clearPast(){ const t = todayISO(); for (const b of state.bookings.filter(b => b.status !== 'deleted' && b.date < t)) await sb.remove(b.id); await reload(); }
async function saveSettings(){ await sb.saveSettings(state.settings); }
async function lookupByPhone(p){ try { return await sb.clientLookup(p); } catch(e){ console.warn(e); return []; } }

const client = { name:'', phone:'', service:null, date:null, time:null, period:null, err:null, submitted:null, lookup:'', lookupResults:null };

function nextWorkingDates(count){
  const out = []; let d = new Date(); d.setHours(0,0,0,0); let guard = 0;
  while (out.length < count && guard < 60){ if (state.settings.workingDays.includes(d.getDay())) out.push(isoOf(d)); d.setDate(d.getDate()+1); guard++; }
  return out;
}
function splitSlots(slots){
  const morningEnd = state.settings.lunchEnabled ? timeToMin(state.settings.lunchStart) : 720;
  const manha = [], tarde = []; slots.forEach(s => (timeToMin(s) < morningEnd ? manha : tarde).push(s)); return [manha, tarde];
}
function defaultPeriod(d, s){ const slots = availableSlots(d, s); if (!slots.length) return null; return splitSlots(slots)[0].length ? 'manha' : 'tarde'; }

function renderClient(){
  const c = client, el = $('#client-content');

  const s = state.settings, dates = nextWorkingDates(10);

      };
      slotHtml = `<span class="label">Hora disponível</span>${sec('manha','Manhã',manha)}${sec('tarde','Tarde',tarde)}`;
    }
  }
  el.innerHTML = `<div class="cols"><div class="col">
    <h2>Marca o teu horário</h2>
    <p class="lead">Escolhe o serviço, o dia e a hora. A tua marcação fica pendente até ser confirmada pela barbearia.</p>

    <span class="label">Dia</span>
    <div class="days">${dates.map(d => { const dd = parseISO(d); return `<button class="day ${c.date === d ? 'on' : ''}" data-date="${d}"><span>${DOW[dd.getDay()]}</span><b>${pad(dd.getDate())}</b></button>`; }).join('')}</div>
    ${slotHtml}

    </div><div class="col col-side">
    <h2 class="small">Já tens uma marcação?</h2>
    <p class="lead">Vê o estado pelo teu número de telemóvel.</p>
    <input class="input" id="c-lookup" type="tel" placeholder="O teu número de telemóvel" value="${esc(c.lookup)}">

    </div></div>`;

   ADMIN
   ========================================================= */
const admin = { tab: 'pendentes', agendaDate: todayISO(), expanded: null, openDays: new Set(), closedDays: new Set() };
const TABS = { pendentes:'Pendentes', confirmadas:'Confirmadas', todas:'Todas', agenda:'Agenda' };

function renderAdmin(){
  $('#tabs').innerHTML = Object.entries(TABS).map(([k,v]) => `<button class="tab ${admin.tab === k ? 'on' : ''}" data-tab="${k}">${v}</button>`).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { admin.tab = b.dataset.tab; admin.expanded = null; renderAdmin(); });
  const body = $('#admin-body');
  body.classList.toggle('agenda-mode', admin.tab === 'agenda');
  if (admin.tab === 'agenda') return renderAgenda(body);
  const all = state.bookings.filter(b => b.status !== 'deleted').sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  const list = admin.tab === 'pendentes' ? all.filter(b => b.status === 'pending') : admin.tab === 'confirmadas' ? all.filter(b => b.status === 'confirmed') : all;
  if (!list.length){ body.innerHTML = '<div class="empty">Sem marcações aqui.</div>'; return; }
  // agrupar por dia
  const groups = []; for (const bk of list){ const g = groups[groups.length-1]; if (g && g.date === bk.date) g.items.push(bk); else groups.push({ date: bk.date, items: [bk] }); }
  const today = todayISO(), tomorrow = shiftISO(today, 1);
  body.innerHTML = groups.map(g => {
    const open = admin.openDays.has(g.date) || (!admin.closedDays.has(g.date) && (g.date === today || g.date === tomorrow));
    const pend = g.items.filter(x => x.status === 'pending').length;
    const d = parseISO(g.date);
    return `<section class="day-group ${open ? 'open' : ''}" data-day="${g.date}">
      <button class="day-head" data-toggle="${g.date}">
        <span class="dh-date">${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}${g.date === today ? ' · hoje' : g.date === tomorrow ? ' · amanhã' : ''}</span>
        <span class="dh-meta">${g.items.length} marcaç${g.items.length === 1 ? 'ão' : 'ões'}${pend ? ` · <b>${pend} pendente${pend > 1 ? 's' : ''}</b>` : ''}</span>
        <span class="dh-arrow">${open ? '▾' : '▸'}</span>
      </button>
      ${open ? `<div class="rows">${g.items.map(compactRow).join('')}</div>` : ''}
    </section>`;
  }).join('');
  body.querySelectorAll('[data-toggle]').forEach(h => h.onclick = () => {
    const day = h.dataset.toggle, wasOpen = h.closest('.day-group').classList.contains('open');
    if (wasOpen){ admin.openDays.delete(day); admin.closedDays.add(day); } else { admin.closedDays.delete(day); admin.openDays.add(day); }
    renderAdmin();
  });
  bindRows(body);
}

function compactRow(b){
  const exp = admin.expanded === b.id;
  return `<div class="brow ${b.status} ${exp ? 'exp' : ''}" data-id="${b.id}">
    <button class="brow-main" data-expand="${b.id}">
      <span class="br-time">${b.time}</span>
      <span class="br-name">${esc(b.name)}</span>
      <span class="br-svc">${esc(svcLabel(b.service))}</span>
      <span class="br-dot" title="${b.status === 'confirmed' ? 'Confirmada' : 'Pendente'}"></span>
    </button>
    ${exp ? `<div class="brow-more"><div class="phone" style="margin-bottom:8px">${esc(b.phone)} · <span class="code">${esc(b.code)}</span></div>
      <div class="row">${b.status === 'pending' ? `<button class="sm accent" data-act="confirm">Confirmar</button>` : ''}<button class="sm" data-act="edit">Editar</button><button class="sm danger" data-act="delete">Eliminar</button></div></div>` : ''}
  </div>`;
}
function bindRows(root){
  root.querySelectorAll('[data-expand]').forEach(btn => btn.onclick = () => { admin.expanded = admin.expanded === btn.dataset.expand ? null : btn.dataset.expand; renderAdmin(); });
  root.querySelectorAll('.brow').forEach(row => {
    const id = row.dataset.id, b = state.bookings.find(x => x.id === id);
    row.querySelectorAll('[data-act]').forEach(btn => btn.onclick = async () => {
      const act = btn.dataset.act;
      if (act === 'confirm'){ await confirmBooking(id); toast('Confirmada'); renderAdmin(); }
      else if (act === 'edit'){ openEdit(b); }
      else if (act === 'delete'){ if (await confirmDialog('Eliminar esta marcação?')){ await deleteBooking(id); toast('Eliminada'); renderAdmin(); } }
    });
  });
}

/* ---- Agenda ---- */
const PX_PER_MIN = 1.15;
function shiftISO(iso, delta){ const d = parseISO(iso); d.setDate(d.getDate()+delta); return isoOf(d); }

function renderAgenda(body){
  const s = state.settings, date = admin.agendaDate;
  const startMin = timeToMin(s.startTime), closeMin = timeToMin(s.endTime), endMin = Math.max(closeMin, timeToMin(AGENDA_END));
  const totalH = Math.max(120, (endMin - startMin) * PX_PER_MIN);
  const dayB = forDay(date), pend = dayB.filter(b => b.status === 'pending').length;
  const d = parseISO(date), isToday = date === todayISO();
  const pastCount = state.bookings.filter(b => b.status !== 'deleted' && b.date < todayISO()).length;

  let grid = '';
  {
    let lines = '';
    for (let m = Math.ceil(startMin/60)*60; m <= endMin; m += 60) lines += `<div class="hline" style="top:${(m-startMin)*PX_PER_MIN}px"><span>${minToTime(m)}</span><i></i></div>`;
    let lunch = '';
    if (s.lunchEnabled){
      const ls = timeToMin(s.lunchStart), le = timeToMin(s.lunchEnd);
      if (le > startMin && ls < endMin){ const a = Math.max(ls,startMin), z = Math.min(le,endMin); lunch = `<div class="lunch" style="top:${(a-startMin)*PX_PER_MIN}px;height:${(z-a)*PX_PER_MIN}px">ALMOÇO</div>`; }
    }
    let after = '';
    if (endMin > closeMin) after = `<div class="after" style="top:${(closeMin-startMin)*PX_PER_MIN}px;height:${(endMin-closeMin)*PX_PER_MIN}px">FORA DE HORÁRIO · SÓ ADMIN</div>`;
    let now = '';
    if (isToday){ const n = new Date(), nm = n.getHours()*60+n.getMinutes(); if (nm >= startMin && nm <= endMin) now = `<div class="now" style="top:${(nm-startMin)*PX_PER_MIN}px"></div>`; }
    const blocks = dayB.map(b => { const dur = svcDur(b.service), h = Math.max(34, dur*PX_PER_MIN);
      return `<div class="block ${b.status}" data-id="${b.id}" style="top:${(timeToMin(b.time)-startMin)*PX_PER_MIN}px;height:${h}px"><div class="ln"><span class="tt">${b.time}</span><span class="nm">${esc(b.name)}</span><span class="t">${dur}min</span></div>${h > 52 ? `<div class="sv">${esc(svcLabel(b.service))}</div>` : ''}</div>`; }).join('');
    grid = `<div class="grid" id="grid" style="height:${totalH}px">${lines}${lunch}${after}${blocks}${now}</div>`;
  }

  body.innerHTML = `<div class="agenda-wrap">
    <div class="agenda-head"><button class="sm" id="ag-prev">◀</button><h3>${DOW[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}${isToday ? ' · hoje' : ''}</h3><button class="sm" id="ag-next">▶</button></div>
    <div class="agenda-count">${dayB.length} marcaç${dayB.length === 1 ? 'ão' : 'ões'}${pend ? ` · ${pend} pendente${pend > 1 ? 's' : ''}` : ''}</div>
    <button class="ghost" id="ag-new" style="border-color:rgba(201,161,74,.4);color:var(--accent);font-size:13px">+ Nova marcação neste dia</button>
    <p class="hint">${dayB.length ? 'Clica numa marcação para ver/editar · arrasta para mudar a hora · ' : 'Sem marcações neste dia · '}duplo clique num espaço vazio para marcar nessa hora.</p>
    ${grid}
    ${pastCount ? `<div style="margin-top:18px"><button class="ghost danger" id="ag-clear" style="font-size:13px">Apagar marcações de dias anteriores (${pastCount})</button></div>` : ''}</div>`;

  $('#ag-prev').onclick = () => { admin.agendaDate = shiftISO(date,-1); renderAdmin(); };
  $('#ag-next').onclick = () => { admin.agendaDate = shiftISO(date, 1); renderAdmin(); };
  $('#ag-new').onclick = () => openNewBooking(date);
  const clr = $('#ag-clear'); if (clr) clr.onclick = async () => { if (await confirmDialog('Apagar marcações passadas?','Esta ação é irreversível.','Sim, apagar')){ await clearPast(); toast('Apagadas'); renderAdmin(); } };
  body.querySelectorAll('.block').forEach(el => bindDrag(el, startMin, endMin));
  const gridEl = $('#grid');
  if (gridEl){
    // duplo clique (rato) ou duplo toque (dedo) em espaço vazio → nova marcação nessa hora
    const openAt = clientY => { const rect = gridEl.getBoundingClientRect(); const min = Math.round(((clientY - rect.top) / PX_PER_MIN) / 15) * 15; openNewBooking(date, minToTime(Math.min(endMin - 15, Math.max(startMin, startMin + min)))); };
    gridEl.addEventListener('dblclick', e => { if (!e.target.closest('.block')) openAt(e.clientY); });
    let lastTap = 0, lastY = 0;
    gridEl.addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse' || e.target.closest('.block')) return;
      const now = Date.now();
      if (now - lastTap < 350 && Math.abs(e.clientY - lastY) < 30){ lastTap = 0; openAt(e.clientY); }
      else { lastTap = now; lastY = e.clientY; }
    });
  }
}

function bindDrag(el, startMin, endMin){
  const b = state.bookings.find(x => x.id === el.dataset.id), dur = svcDur(b.service);
  const baseTop = (timeToMin(b.time) - startMin) * PX_PER_MIN;
  const latest = Math.max(startMin, endMin - dur);
  const snap = topPx => Math.min(latest, Math.max(startMin, startMin + Math.round((topPx / PX_PER_MIN) / 5) * 5));
  let startY = 0, off = 0, dragging = false, moved = false;
  el.addEventListener('pointerdown', e => { startY = e.clientY; off = 0; dragging = true; moved = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!dragging) return; off = e.clientY - startY;
    if (Math.abs(off) > 4) moved = true;
    if (!moved) return;
    el.classList.add('dragging'); el.style.transform = `translateY(${off}px)`;
    el.querySelector('.tt').textContent = minToTime(snap(baseTop + off));
  });
  const end = async e => {
    if (!dragging) return; dragging = false; el.classList.remove('dragging'); el.style.transform = '';
    if (!moved){ openDetail(b); return; }
    const nt = minToTime(snap(baseTop + off));
    if (nt !== b.time){ await moveBooking(b.id, nt); toast('Movida para ' + nt); }
    renderAdmin();
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

function openDetail(b){
  openSheet(`<div class="code">${esc(b.code)}</div><div class="name" style="font-size:24px">${esc(b.name)}</div><div class="phone">${esc(b.phone)}</div>${badge(b.status)}<div class="divider"></div>${fields(b)}
    <div class="row" style="margin-top:16px">${b.status === 'pending' ? '<button class="ghost" id="d-confirm" style="border-color:rgba(201,161,74,.4);color:var(--accent)">Confirmar</button>' : ''}<button class="ghost" id="d-edit">Editar</button><button class="ghost danger" id="d-delete">Eliminar</button></div>
    <button class="ghost" style="border:0;margin-top:8px" onclick="closeSheet()">Fechar</button>`);
  const c = $('#d-confirm'); if (c) c.onclick = async () => { await confirmBooking(b.id); closeSheet(); toast('Confirmada'); renderAdmin(); };
  $('#d-edit').onclick = () => { closeSheet(); openEdit(b); };
  $('#d-delete').onclick = async () => { await deleteBooking(b.id); closeSheet(); toast('Eliminada'); renderAdmin(); };
}

function openNewBooking(date, initialTime){

  openSheet(`<h2>Nova marcação</h2><p class="lead">${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)} · podes marcar a qualquer hora, incluindo fora do horário de funcionamento (até ${AGENDA_END})</p>

    <label class="label" for="n-time">Hora (livre — sobreposição permitida)</label><input class="input mono" type="time" step="300" id="n-time" value="${initialTime || s.startTime}">

    <div class="err" id="n-err"></div>
    <div style="margin-top:16px"><button class="btn" id="n-create">Criar marcação</button></div>
    <button class="ghost" style="border:0;margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
  $('#n-svc').querySelectorAll('[data-k]').forEach(p => p.onclick = () => { svc = p.dataset.k; $('#n-svc').querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === p)); });
  $('#n-status').querySelectorAll('[data-s]').forEach(p => p.onclick = () => { status = p.dataset.s; $('#n-status').querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === p)); });

  };
  setTimeout(() => $('#n-name').focus(), 50);

    d.pass = $('#s-pass').value; d.blInput = $('#s-bl').value;
  };
  el.querySelectorAll('[data-dow]').forEach(b => b.onclick = () => { sync(); const n = +b.dataset.dow; d.workingDays.includes(n) ? d.workingDays = d.workingDays.filter(x => x !== n) : d.workingDays.push(n); renderSettings(); });
  $('#s-lunch').onclick = () => { sync(); d.lunchEnabled = !d.lunchEnabled; renderSettings(); };
  el.querySelectorAll('[data-sx]').forEach(b => b.onclick = () => { sync(); d.services.splice(+b.dataset.sx, 1); renderSettings(); });
  $('#s-add').onclick = () => { sync(); d.services.push({ key:'', label:'', duration:30 }); renderSettings(); setTimeout(() => { const ins = el.querySelectorAll('[data-sl]'); ins[ins.length-1]?.focus(); }, 30); };
  $('#s-save').onclick = async () => {
    sync();
    const svc = d.services.filter(x => x.label.trim()).map((x,i) => ({ key: x.key || `svc_${Date.now()}_${i}`, label: x.label.trim(), duration: Math.max(5, x.duration || 0) }));
    const s = state.settings;
    Object.assign(s, { workingDays: d.workingDays, startTime: d.startTime, endTime: d.endTime, lunchEnabled: d.lunchEnabled, lunchStart: d.lunchStart, lunchEnd: d.lunchEnd, services: svc.length ? svc : defaultSettings().services });
    try {
      if (d.pass.trim()){ if (d.pass.trim().length < 6) { toast('Palavra-passe: mínimo 6 caracteres'); return; } await auth.changePassword(d.pass.trim()); }
      await saveSettings(); toast('Definições guardadas'); show('admin'); renderAdmin();
    } catch(e){ toast(e.message || 'Erro ao guardar'); console.error(e); }
  };
  $('#s-bl-add').onclick = async () => {
    sync(); const np = normPhone(d.blInput); if (!np) return;
    if (!d.blacklist.includes(np)) d.blacklist.push(np);
    state.settings.blacklist = [...d.blacklist]; await saveSettings(); d.blInput = ''; toast('Número bloqueado'); renderSettings();
  };
  el.querySelectorAll('[data-blr]').forEach(b => b.onclick = async () => {
    sync(); d.blacklist = d.blacklist.filter(p => p !== b.dataset.blr);
    state.settings.blacklist = [...d.blacklist]; await saveSettings(); toast('Número desbloqueado'); renderSettings();
  });
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  try { applyTheme(localStorage.getItem('theme_id') || 'gold'); } catch(e){}
  $('#client-content').innerHTML = '<div class="loading">a carregar…</div>';
  auth.load();
  try { state.settings = await sb.getPublicSettings(); state.occupancy = await sb.getOccupancy(); }
  catch(e){ console.error('init', e); }
  state.loading = false;
  client.service = firstSvc();
  renderClient();
})();
</script>
